[project]
name = "aura"
version = "0.1.0"
description = "Yuki OS Portal backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "bcrypt>=5.0.0",
    "crewai>=1.15.20",
    "crewai-tools[mcp]>=1.15.20",
    "extract-msg>=0.56.1",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.60.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "keyring>=25.7.0",
    "mcp>=1.28.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.26.7",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "rapidocr-onnxruntime>=1.4.4",
    "reportlab>=4.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
# Docling for PDFs (layout, table grids, OCR): uv sync --extra docling. ~1.3 GB with CPU torch;
# models go in backend/data/docling-models (RUNNING.md). rapidocr 3.10 breaks docling 2.135.
docling = [
    "docling>=2.135,<2.136",
    "rapidocr>=3.9.1,<3.10",
    "torch>=2.6",
    "torchvision>=0.21",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
