[project]
name = "aura"
version = "0.1.0"
description = "Yuki OS Portal backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "bcrypt>=5.0.0",
    "crewai>=1.15.20",
    "crewai-tools[mcp]>=1.15.20",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.60.0",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
    "mcp>=1.28.1",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
